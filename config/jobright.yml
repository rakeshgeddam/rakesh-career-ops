# Jobright.ai Integration Configuration
# Jobright is used as a LEAD SOURCE only — not as the canonical job URL.
#
# How it works:
#   1. `node scripts/jobright-login.mjs`  → log in once, saves browser session
#   2. `node scripts/jobright-sync.mjs`   → reads saved/recommended lists,
#      navigates to each detail page, extracts the actual external job URL,
#      and writes entries to data/pipeline.md + data/scan-history.tsv
#   3. Pipeline processes the canonical external URLs normally (evaluate → report → apply)
#
# IMPORTANT: Never store plaintext passwords here.
# Auth is handled via Playwright storage state (cookies + localStorage).

jobright:
  enabled: true
  base_url: "https://jobright.ai"

  auth:
    # Path to the saved Playwright storage state (cookies + localStorage).
    # Generated by: node scripts/jobright-login.mjs
    # This file is gitignored — it stays local only.
    storage_state_path: ".auth/jobright-storage-state.json"
    # Reuse a saved session if it exists; otherwise open browser for manual login.
    reuse_saved_session: true
    # Session files are stored in the .auth/ directory which is gitignored.

  lists:
    # Which Jobright lists to sync. Available: saved, recommended, applied
    - "saved"
    - "recommended"

  extraction:
    # Prefer the real external job posting URL over the Jobright detail URL.
    # The system tries these in order:
    #   1. "Apply" / "Apply Now" button href
    #   2. "View Original Posting" / "View Job" link
    #   3. Redirect URL from clicking the apply button
    #   4. og:url or canonical meta tag
    #   5. Fall back to the Jobright detail URL if nothing is found
    prefer_external_url: true
    # Also store the source Jobright URL alongside the canonical URL.
    keep_source_url: true
    # Strip common tracking query params (utm_*, ref=, etc.) from canonical URLs.
    strip_tracking_params: true
    # Selectors to try when looking for the external URL on a detail page.
    # Ordered by reliability. Adjust if Jobright changes their layout.
    apply_button_selectors:
      - "a[data-testid='apply-button']"
      - "a.apply-btn"
      - "a:has-text('Apply Now')"
      - "a:has-text('Apply')"
    external_link_selectors:
      - "a[data-testid='original-posting']"
      - "a:has-text('View Original')"
      - "a:has-text('View Job Posting')"
      - "a:has-text('Original Posting')"

  sync:
    # Maximum number of job listings to process per sync run.
    max_jobs_per_run: 100
    # Skip listings whose canonical URL (or Jobright URL) is already in:
    #   - data/scan-history.tsv
    #   - data/pipeline.md
    #   - data/applications.md
    skip_duplicates: true
    # Append new entries to data/pipeline.md (Pendientes section).
    write_to_pipeline: true
    # Record every seen URL in data/scan-history.tsv for future dedup.
    write_to_scan_history: true
    # Delay between navigating detail pages (ms) to avoid rate limiting.
    page_delay_ms: 1500

  apply:
    # Apply mode: "assisted" means the system prepares everything but
    # requires the user to review and confirm before each final submit.
    # "draft_only" means generate material only — no browser navigation.
    mode: "assisted"
    require_confirmation: true
